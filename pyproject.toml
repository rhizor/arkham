[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arkham-ctf"
version = "1.0.0"
description = "ARKHAM - Automated Reconnaissance & Knowledge HARvesting Agent of Providence"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "rhizor", email = "rhizor@example.com"}
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "click>=8.1.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.scripts]
arkham = "arkham.cli:main"
arkham-agent = "arkham.cli:main"

[project.urls]
Homepage = "https://github.com/rhizor/arkham"
Documentation = "https://github.com/rhizor/arkham/blob/master/USAGE.md"
Issues = "https://github.com/rhizor/arkham/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["arkham*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
